services:
  db:
    image: postgres:latest
    container_name: sep_db
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: sep
      POSTGRES_PASSWORD: sep
      POSTGRES_DB: sep
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    container_name: sep_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sep
      SPRING_DATASOURCE_USERNAME: sep
      SPRING_DATASOURCE_PASSWORD: sep
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: sep_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: