# Diese Konfiguration überschreibt die normale application.properties NUR für Tests

# 1. H2 In-Memory Datenbank nutzen (statt Postgres)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Hibernate Dialekt auf H2 stellen
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 3. Datenbank-Schema bei jedem Test frisch erstellen
spring.jpa.hibernate.ddl-auto=create-drop

# 4. Dummy API Key für Tests (damit der Context lädt)
gemini.api.key=test-dummy-key